[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpx-processing-pipeline"
version = "0.1.0"
description = "Deterministic GPX interoperability and geospatial processing"
requires-python = ">=3.11"
dependencies = ["lxml>=5,<7", "geographiclib>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
